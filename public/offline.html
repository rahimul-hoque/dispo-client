<!--
  Shown by the Android app (capacitor.config.ts server.errorPath) when the
  live site can't be loaded: no connection, a timeout, or a server error.
  Bundled inside the app, so it can't load anything from the network:
  the logo is inlined and there are no external fonts or scripts.
-->
<style>
  :root { --bg: #f5f6f1; --text: #181c20; --muted: #5b4137; --primary: #ff5d00; --card: #ffffff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 24px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button {
    width: 100%; border: 0; border-radius: 999px; padding: 14px 20px;
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  button:disabled { opacity: .75; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); border-top-color: #fff;
    animation: spin .8s linear infinite; display: none;
  }
  .busy .spinner { display: inline-block; }
  .hint { font-size: 13px; margin-top: 16px; margin-bottom: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

  <p id="message">Check your internet connection. We'll reconnect automatically as soon as it's back.</p>
  <button id="retry" type="button"><span class="spinner"></span><span id="label">Try again</span></button>

<script>
  // The app's start page. This file is served from the same origin, so
  // navigating there reloads the live site.
  var APP_URL = location.origin + "/";
  var button = document.getElementById("retry");
  var label = document.getElementById("label");
  var hint = document.getElementById("hint");

  function setOfflineCopy() {
    if (!navigator.onLine) {
      document.getElementById("title").textContent = "You're offline";
      document.getElementById("message").textContent =
        "Turn on Wi-Fi or mobile data. We'll reconnect automatically as soon as you're back online.";
    }
  }

  function retry() {
    button.disabled = true;
    button.classList.add("busy");
    label.textContent = "Connecting…";
    location.replace(APP_URL);
  }

  button.addEventListener("click", retry);
  // Reconnect by itself when the connection returns, and keep trying
  // every 15s in case the site was only briefly unreachable.
  window.addEventListener("online", retry);
  var seconds = 15;
  setInterval(function () {
    if (button.disabled) return;
    seconds -= 1;
    if (seconds <= 0) { retry(); return; }
    hint.textContent = navigator.onLine ? "Retrying in " + seconds + "s" : "";
  }, 1000);
  setOfflineCopy();
</script>
</body>
</html>
